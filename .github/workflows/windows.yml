name: Windows

# Builds Moroder for Windows with MSYS2 (UCRT64: GCC, libmpv, libcurl,
# libjpeg-turbo, libpng), packages moroder.exe with every DLL it needs, and on
# a v* tag attaches the zip to that release (install.ps1 downloads it).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'install.sh']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-ntldd

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORODER_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/moroder.exe --version
          ./build/moroder.exe --help
          ./build/moroder.exe nope || true

      - name: Package
        id: pkg
        run: |
          v="${{ steps.ver.outputs.version }}"
          name="moroder-${v}-windows-x86_64"
          mkdir -p "dist/$name"
          cp build/moroder.exe README.md LICENSE "dist/$name/"
          # Every DLL moroder.exe loads from MSYS2 (not Windows' own).
          ntldd -R build/moroder.exe | grep -io '[a-z]:\\[^ ]*ucrt64\\bin\\[^ ]*\.dll' | sort -u | while read -r dll; do
            cp "$(cygpath -u "$dll")" "dist/$name/"
          done
          ls "dist/$name"
          (cd dist && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Packaged build runs on its own
        shell: pwsh
        run: |
          $d = "dist\${{ steps.pkg.outputs.name }}"
          $env:Path = "C:\Windows\System32;C:\Windows"
          & "$d\moroder.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is published by hand right after the tag: wait for it.
          for i in $(seq 1 30); do gh release view "${GITHUB_REF#refs/tags/}" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "${GITHUB_REF#refs/tags/}" dist/*.zip dist/*.zip.sha256 --clobber
