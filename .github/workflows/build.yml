name: Build

# Moroder on all three systems, on every push: builds, runs the binary, and
# runs the tests (tests/, with the Chrome / Edge the runners have).
# Windows: MSYS2 (UCRT64: GCC, libmpv, libcurl, libjpeg-turbo, libpng),
# moroder.exe packaged with every DLL it needs; on a v* tag the zip is
# attached to that release (install.ps1 downloads it).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'install.sh']
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes the run before it pointless (tags always finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Compiles go through ccache, kept between runs (actions/cache): only what
# changed is rebuilt, FTXUI and the other dependencies included.
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 400M
  CCACHE_COMPRESS: "1"
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false        # the runner's MSYS2 is recent enough; updating it took over a minute
          install: >-
            git
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-ccache

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORODER_VERSION="${{ steps.ver.outputs.version }}" -DMORODER_TESTS=ON

      - name: Build
        run: |
          cmake --build build --parallel -- -k 0      # every error at once
          ccache -s | head -n 6 || true

      - name: Smoke test
        run: |
          ./build/moroder.exe --version
          ./build/moroder.exe --help
          ./build/moroder.exe nope || true

      - name: Tests
        run: ./build/browser_window_test.exe

      - name: Package
        id: pkg
        run: |
          v="${{ steps.ver.outputs.version }}"
          name="moroder-${v}-windows-x86_64"
          mkdir -p "dist/$name"
          cp build/moroder.exe README.md LICENSE "dist/$name/"
          # Every DLL moroder.exe loads from MSYS2 (not Windows' own).
          ntldd -R build/moroder.exe | grep -io '[a-z]:\\[^ ]*ucrt64\\bin\\[^ ]*\.dll' | sort -u | while read -r dll; do
            cp "$(cygpath -u "$dll")" "dist/$name/"
          done
          # CaskaydiaMono Nerd Font (Cascadia with the icons), for the Windows
          # Terminal profile install.ps1 adds: two files of the family, OFL.
          mkdir -p "dist/$name/fonts"
          curl -fsSL -o nf.zip https://github.com/ryanoasis/nerd-fonts/releases/latest/download/CascadiaMono.zip
          unzip -oq -j nf.zip 'CaskaydiaMonoNerdFontMono-Regular.ttf' 'CaskaydiaMonoNerdFontMono-Bold.ttf' -d "dist/$name/fonts"
          unzip -oq -j nf.zip 'LICENSE*' -d "dist/$name/fonts" || true
          ls "dist/$name" "dist/$name/fonts"
          (cd dist && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Packaged build runs on its own
        shell: pwsh
        run: |
          $d = "dist\${{ steps.pkg.outputs.name }}"
          $env:Path = "C:\Windows\System32;C:\Windows"
          & "$d\moroder.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh          # gh is on the Windows PATH, not in the MSYS2 shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # The release is published by hand right after the tag: wait for it.
          for ($i = 0; $i -lt 30; $i++) { gh release view $tag *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 20 }
          gh release upload $tag (Get-ChildItem dist -Filter *.zip*).FullName --clobber

      - name: install.ps1 installs this release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:MORODER_VERSION = "${{ steps.ver.outputs.version }}"
          ./install.ps1
          & "$env:LOCALAPPDATA\Programs\moroder\moroder.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Run again: an update over a running moroder.exe must not break it.
          $p = Start-Process "$env:LOCALAPPDATA\Programs\moroder\moroder.exe" -ArgumentList "keys" -PassThru -WindowStyle Hidden
          ./install.ps1
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          & "$env:LOCALAPPDATA\Programs\moroder\moroder.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build pkg-config libmpv-dev libcurl4-openssl-dev \
            libjpeg-dev libpng-dev libsystemd-dev ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORODER_TESTS=ON
          cmake --build build --parallel
          ccache -s | head -n 6 || true
      - name: Smoke test
        run: |
          ./build/moroder --version
          ./build/moroder --help
      - name: Tests
        run: ./build/browser_window_test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install mpv jpeg-turbo libpng pkg-config ninja ccache
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMORODER_TESTS=ON
          cmake --build build --parallel
          ccache -s | head -n 6 || true
      - name: Smoke test
        run: |
          ./build/moroder --version
          ./build/moroder --help
      - name: Tests
        run: ./build/browser_window_test

